pageTitle: Sending your paper fit note to DWP - Send your fit note - GOV.UK
h1: Sending your paper fit note to DWP
h2: Check that your fit note is valid
med3-list:
  li1: "Your fit note should be a Med 3 fit note issued by a health practitioner, such as a GP. It should look like this example:"
  li2: The small black and white square (called a data matrix) at the bottom of your fit note should be clear.
uploading:
  h2: Uploading your paper fit note
  p1: "To send your paper fit note online you will need to either:"
  li1: take a photo of your fit note
  li2: scan your fit note
  p2: Portrait or landscape images will be accepted but not double-sided fit notes. You can only upload one fit note at a time.
  info: If you cannot send it online,
  post-link: " find out how to post your paper fit note to us (opens in new tab)"
good-photo:
  h3: How to take a good photo
  li1: "Put the fit note on a flat surface, making sure it is lying straight."
  li2: It should have no creases or folds.
  li3: "Make sure it is well lit and there are no shadows."
  li4: The whole fit note, including all 4 corners, should be visible.
scan:
  h3: How to scan your fit note
  li1: Make sure the scanner is connected to a laptop or other device.
  li2: Place the fit note text side down on the scanner. If your fit note is double-sided, you must scan the side which shows your details.
  li3: Make sure the fit note is lying straight and there are no creases or folds.
  li4: Save the scanned image somewhere that is easy to find later.
  p: Some smartphones have an app which can scan documents. If you have a smartphone, check to see if it has this app.
accepted:
  h2: Check that the photo or scan will be accepted
  p1: "Your photo or scan should be accepted if:"
  li1: it is clear and easy to read
  li2: the whole fit note is visible, including all four corners
  p2: The example image with the red cross could be rejected because the edges are missing. The example image with the green tick would be accepted because the whole fit note is visible.
p: "You will need to enter your National Insurance number after you have uploaded your fit note. You can find this on your benefit letter, payslip or P60."
buttonText: Continue to upload