pageTitle: "Manylion am gwcis ar y gwasanaeth hwn – Anfon eich nodyn ffitrwydd - GOV.UK"
h1: Manylion am gwcis ar y gwasanaeth hwn
p1: "Rydym angen defnyddio cwcis angenrheidiol i wneud y wefan ‘Anfon eich nodyn ffitrwydd ar gyfer eich cais ESA’ weithio."
insetText: "Gallwch <a href='/cookies/cookie_policy' class='govuk-link'>newid eich cwcis rydych yn hapus i ni eu defnyddio</a>."
h2: Os yw eich cwcis wedi cael eu troi i ffwrdd
p2: Fe welwch neges gwall pan geisiwch ddefnyddio'r wefan os yw'ch cwcis wedi eu analluogi.
p3: Mae sut i droi cwcis ymlaen yn dibynnu ar <a href='https://www.whatsmybrowser.org/' target='_blank' class='govuk-link'>y porwr rydych yn ei ddefnyddio (agor mewn tab newydd)</a> a pa mor gyfredol yw.
p4: "Darganfyddwch sut i newid eich gosodiadau ar gyfer y porwyr mwyaf poblogaidd, yn cynnwys:"
li1: "<a href='https://support.microsoft.com/en-us/products/windows?os=windows-10' target='_blank' class='govuk-link'>Internet Explorer (agor mewn tab newydd)</a>"
li2: "<a href='https://www.mozilla.org/en-US/?v=a' target='_blank' class='govuk-link'>Mozilla Firefox (agor mewn tab newydd)</a>"
li3: "<a href='https://support.google.com/accounts/answer/61416?hl=en' target='_blank' class='govuk-link'>Google Chrome (agor mewn tab newydd)</a>"
li4: "<a href='https://www.apple.com/' target='_blank' class='govuk-link'>Safari (agor mewn tab newydd)</a>, a ddefnyddir yn fwyaf cyffredin ar iPad, iPhone a chyfrifiaduron eraill Apple"
p5: "Darganfyddwch sut <a href='http://www.aboutcookies.org/Default.aspx?page=1' target='_blank' class='govuk-link'>i reoli cwcis (agor mewn tab newydd)</a>ar gyfer porwyr eraill."
measure: "Cwcis sy'n mesur defnydd o wefan"
p6: "Rydym yn defnyddio meddalwedd Google Analytics i gasglu gwybodaeth am sut rydych yn defnyddio'r wefan. Rydym yn defnyddio'r wybodaeth yma i wella'r wefan hon."
insetText2: "Nid ydym yn caniatau i Google ddefnyddio neu'r rannu'r data am sut rydych yn defnyddio'r safle yma."
p7: "Mae cwcis Google analytics yn casglu a storio gwybodaeth am:"
li5: "y dudalen rydych yn ymweld â hi - beth rydych yn clicio arno pan yn defnyddio'r wefan"
li6: pa mor hir rydych yn ei dreulio ar bob tudalen
li7: sut rydych wedi cyrraedd y wefan
