informationSecureCookies: "Cwcis sy'n helpu i gadw eich gwybodaeth yn ddiogel"
p8: Rydym yn defnyddio cwcis sesiwn i gadw'ch gwybodaeth yn ddiogel wrth i chi symud yn ôl ac ymlaen trwy'r wefan.
p9: "Mae'r cwcis hyn yn cael eu dileu o'ch cyfrifiadur yn awtomatig pan fyddwch yn cwblhau'ch cais neu os byddwch:"
li8: ddim yn gwneud dim am 30 munud
li9: yn cau eich porwr
li10: troi eich cyfrifiadur i ffwrdd
