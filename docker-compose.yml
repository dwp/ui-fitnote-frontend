# To execute this docker-compose yml file use `docker-compose -f docker-compose-v3.yml up`
# Add the `-d` flag at the end for detached execution
# To stop the execution, hit Ctrl+C, and then `docker-compose -f docker-compose-v3.yml down`
version: "3"

networks:
  qa-fitnote-ui-tests:

services:
  redis-cluster:
    image: bitnami/redis-cluster@sha256:00cd760641dc73dca95826e6be8fa2b02b844086c0e1d2314bec0f78c69aefaa
    ports:
      - '7000:7000'
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "7000", "ping" ]
      interval: 1s
      timeout: 3s
      retries: 30
    environment:
      - 'REDIS_PORT_NUMBER=7000'
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_CLUSTER_REPLICAS=0'
      - 'REDIS_NODES=redis-cluster redis-cluster redis-cluster redis-cluster redis-cluster'
      - 'REDIS_CLUSTER_CREATOR=yes'
      - 'REDIS_CLUSTER_DYNAMIC_IPS=no'
      - 'REDIS_CLUSTER_ANNOUNCE_IP=redis-cluster'
    networks:
      - qa-fitnote-ui-tests

  localstack:
    container_name: localstack
    image: localstack/localstack:1.4.0@sha256:7badf31c550f81151c485980e17542592942d7f05acc09723c5f276d41b5927d
    ports:
      - 4566:4566
    environment:
      - KMS_PROVIDER=local-kms
      - AWS_ACCESS_KEY_ID=my-key
      - AWS_SECRET_ACCESS_KEY=its-a-secret
      - AWS_REGION=us-east-1
      - SERVICES=s3,sns,sqs,kms
      - HOSTNAME_EXTERNAL=localstack
    expose:
      - 4566
    volumes:
      - ./mocks/localstack/docker-entrypoint-initaws.d:/docker-entrypoint-initaws.d
    networks:
      - qa-fitnote-ui-tests

  datamatrix-controller:
    image: $DATAMATRIX_IMAGE
    environment:
      - SERVER_APP_PORT=3009
      - ESTIMATED_REQUEST_MEMORY_MB=1
    expose:
      - 3009
    ports:
      - 3009:3009
    networks:
      - qa-fitnote-ui-tests

  fitnote-controller:
    image: $CONTROLLER_IMAGE
    environment:
      - SERVER_APP_PORT=3004
      - REDIS_STORE_URI=redis-cluster:7000
      - AWS_ACCESS_KEY_ID=my-key
      - AWS_SECRET_ACCESS_KEY=its-a-secret
      - AWS_REGION=us-east-1
      - KMS_ENDPOINT_OVERRIDE=http://localstack:4566
      - REDIS_DATA_KEY_REQUESTID=alias/redis_request_id
      - SNS_DATA_KEY_REQUEST_ID=alias/test_event_request_id
      - SNS_TOPIC_NAME=fitnote-topic
      - SNS_ROUTING_KEY=sns.fitnote.new
      - SNS_SUBJECT=fitnote-controller
      - S3_ENDPOINT_OVERRIDE=http://localstack:4566
      - ENDPOINT_OVERRIDE=http://localstack:4566
      - S3_BUCKET_NAME=sns-bucket
      - REGION=us-east-1
      - ESTIMATED_REQUEST_MEMORY_MB=1
      - DATA_MATRIX_CREATOR_SERVICE_URL=http://datamatrix-controller:3009
    expose:
      - 3004
    ports:
      - 3004:3004
    networks:
      - qa-fitnote-ui-tests

  test-ui:
    image: $APP_IMAGE
    environment:
      - PORT=3000
      - API_URL=http://fitnote-controller:3004
      - REDIS_HOST=redis-cluster
      - REDIS_PORT=7000
      - REDIS_CLUSTER=true
      - GOOGLE_TAG_MANAGER_DOMAIN=test-ui
      - DISABLE_CSP=true
    ports:
      - 3000:3000
    expose:
      - 3000
    networks:
      - qa-fitnote-ui-tests
    depends_on:
      - redis-cluster

  chrome:
    image: selenium/node-chrome:148.0-20260505@sha256:b215aa1d42e96fb97ded0b30684b51452e85d4a57d859e5713f5c5bc42d9ba1e
    volumes:
      - /tmp:/tmp
    networks:
      - qa-fitnote-ui-tests
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=8
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    ports:
      - "6900:5900"
    logging:
      driver: none

  selenium-hub:
    image: selenium/hub:4.44.0@sha256:37f188dde0218827c3bf7dabb331f84606e54f0b5b831c32133aec23ab041a85
    container_name: selenium-hub
    networks:
      - qa-fitnote-ui-tests
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    logging:
      driver: none

  fitnote-test-harness:
    container_name: maven_journey_test
    image: '${TEST_IMAGE_CONTAINER}'
    environment:
      - TEST_RUNNER=TestRunner
      - SELENIUM_URL=http://selenium-hub
      - SELENIUM_PORT=4444
      - JAVA_OPTS=-Dselenium.LOGGER.level=NONE -DLOG_LEVEL=NONE
      - FIT_NOTE_URI=http://test-ui:3000
      - CUCUMBER_REPORTS=${PWD}/cucumber-reports
      - SUITE_XML_FILE=src/test/resources/testng/remote/chrome.xml
      - TEST_TAG=
    volumes:
      - ${MVN_M2}:/root/.m2
      - ${MVN_SETTINGS_FILE}:/root/.m2/settings.xml
      - ./cucumber-reports:/usr/src/mymaven/cucumber-reports
    networks:
      - qa-fitnote-ui-tests
    depends_on:
      - selenium-hub
      - test-ui
      - chrome

